# Проверка сборки на macOS-машине GitHub (Apple Silicon).
# Секреты не нужны: тесты не обращаются к Claude API, приложение собирается без подписи.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: NOVACore — swift test
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build & test
        run: swift test 2>&1 | tee swift-test.log
        shell: bash -o pipefail {0}
      - name: Annotate errors
        if: failure()
        shell: bash
        run: |
          bash .github/scripts/annotate-errors.sh swift-test.log
      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swift-test-log
          path: swift-test.log

  app-build:
    name: NOVA.app — xcodebuild
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build app
        shell: bash -o pipefail {0}
        run: |
          xcodebuild \
            -project NOVA.xcodeproj \
            -scheme NOVA \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log
      - name: Annotate errors
        if: failure()
        shell: bash
        run: |
          bash .github/scripts/annotate-errors.sh xcodebuild.log
      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log

      # Самопроверка: запуск настоящего приложения на этом Mac без API-ключа.
      # Отчёт попадает в Summary запуска, скриншоты — в артефакт "self-test".
      - name: Self-test (UI screenshots + real actions)
        shell: bash
        run: |
          APP="build/Build/Products/Debug/NOVA AI.app"
          OUT="$PWD/self-test"
          mkdir -p "$OUT"
          # Подпись ad-hoc, чтобы macOS разрешила запуск и учла entitlements.
          codesign --force --deep --sign - --entitlements App/Resources/NOVA.entitlements "$APP" || true
          # Запуск под lldb: при падении печатается стек вызовов с файлами и строками.
          lldb --batch \
            -o "run" \
            -k "thread backtrace all" \
            -k "quit 1" \
            -- "$APP/Contents/MacOS/NOVA AI" --self-test "$OUT" > "$OUT/app-log.txt" 2>&1 &
          PID=$!
          for i in $(seq 1 360); do
            kill -0 "$PID" 2>/dev/null || break
            sleep 1
          done
          kill "$PID" 2>/dev/null || true
          pkill -f "NOVA AI" 2>/dev/null || true
          cp ~/Library/Logs/DiagnosticReports/NOVA* "$OUT/" 2>/dev/null || true
          echo "===== app-log.txt ====="
          cat "$OUT/app-log.txt" || true
          if grep -q "stop reason" "$OUT/app-log.txt" 2>/dev/null; then
            {
              echo "## NOVA AI упала при запуске"
              echo '```'
              grep -E "stop reason|frame #[0-9]+:.*NOVA|Fatal error|fatal error|Thread [0-9]+ Crashed|error:" "$OUT/app-log.txt" | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=self-test crash::NOVA AI упала при запуске — стек вызовов в логе шага и в Summary"
          fi
          if [ -f "$OUT/report.md" ]; then
            cat "$OUT/report.md"
            cat "$OUT/report.md" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Скриншоты: архив **self-test** в разделе Artifacts ниже." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=self-test::Отчёт не создан — смотрите app-log.txt в артефакте self-test"
            tail -50 "$OUT/app-log.txt" || true
          fi
      - name: Upload self-test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-test
          path: self-test
          if-no-files-found: warn

      # Готовое приложение для запуска на любом Mac без Xcode (Apple Silicon + Intel).
      - name: Build release app (universal)
        shell: bash -o pipefail {0}
        run: |
          xcodebuild \
            -project NOVA.xcodeproj \
            -scheme NOVA \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build-release \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tail -20
      - name: Package NOVA-AI.zip
        shell: bash
        run: |
          APP="build-release/Build/Products/Release/NOVA AI.app"
          codesign --force --deep --options runtime --sign - --entitlements App/Resources/NOVA.entitlements "$APP"
          codesign --verify --verbose "$APP"
          lipo -info "$APP/Contents/MacOS/NOVA AI"
          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/NOVA-AI.zip"
          ls -lh dist
      - name: Upload NOVA-AI.zip
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-AI-macOS
          path: dist/NOVA-AI.zip
          if-no-files-found: error
